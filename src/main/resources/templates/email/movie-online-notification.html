<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影上线通知</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .email-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .email-body {
            padding: 30px 20px;
        }
        .greeting {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .movie-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        .movie-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin: 0 0 10px 0;
        }
        .movie-info {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .action-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            padding: 14px 40px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0;
            transition: transform 0.2s;
        }
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 20px 0;
        }
        .reservation-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
        .reservation-info p {
            margin: 5px 0;
            color: #856404;
            font-size: 14px;
        }
        .email-footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
            line-height: 1.8;
        }
        .footer-link {
            color: #667eea;
            text-decoration: none;
        }
        .highlight {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <h1>🎬 您预约的电影已上线！</h1>
        </div>

        <!-- Body -->
        <div class="email-body">
            <!-- Greeting -->
            <div class="greeting">
                <p>尊敬的 <span class="highlight" th:text="${username}">用户</span>，您好！</p>
            </div>

            <!-- Reservation Info -->
            <div class="reservation-info">
                <p>📅 您在 <strong th:text="${#temporals.format(reservationDate, 'yyyy-MM-dd HH:mm')}">2025-10-04 10:00</strong> 提交的预约已经处理完成</p>
            </div>

            <!-- Movie Card -->
            <div class="movie-card">
                <h2 class="movie-title">🎥 《<span th:text="${movieTitle}">电影标题</span>》</h2>
                <div class="movie-info">
                    <p>好消息！您预约的这部电影现已正式上线，可以立即观看或下载了！</p>
                    <p>感谢您的耐心等待，现在就去享受精彩的电影时光吧！</p>
                </div>
            </div>

            <!-- Action Button -->
            <div style="text-align: center;">
                <a th:href="${actionUrl}" class="action-button" target="_blank">
                    立即观看 →
                </a>
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Additional Info -->
            <div style="color: #666; font-size: 14px; line-height: 1.8;">
                <p><strong>温馨提示：</strong></p>
                <ul style="padding-left: 20px;">
                    <li>点击上方按钮即可跳转到电影详情页</li>
                    <li>如果按钮无法点击，请复制以下链接到浏览器访问：<br>
                        <span style="color: #667eea; word-break: break-all;" th:text="${actionUrl}">链接地址</span>
                    </li>
                    <li>如有任何问题，请联系我们的客服团队</li>
                </ul>
            </div>
        </div>

        <!-- Footer -->
        <div class="email-footer">
            <p>此邮件由系统自动发送，请勿直接回复</p>
            <p>© 2025 电影预约系统 | <a href="#" class="footer-link">使用帮助</a> | <a href="#" class="footer-link">隐私政策</a></p>
            <p>如果您不想再收到此类邮件，请 <a href="#" class="footer-link">取消订阅</a></p>
        </div>
    </div>
</body>
</html>
